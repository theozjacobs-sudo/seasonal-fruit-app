name: Seasonal
options:
  bundleIdPrefix: com.seasonal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  Seasonal:
    type: application
    platform: iOS
    sources:
      - path: Seasonal
      - path: Shared
    resources:
      - path: Seasonal/Resources/produce_data.json
    settings:
      base:
        INFOPLIST_FILE: Seasonal/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.seasonal.app
        CODE_SIGN_ENTITLEMENTS: Seasonal/Seasonal.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - target: SeasonalWidgetExtension
        embed: true

  SeasonalWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SeasonalWidget
      - path: Shared
    resources:
      - path: Seasonal/Resources/produce_data.json
    settings:
      base:
        INFOPLIST_FILE: SeasonalWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.seasonal.app.widget
        CODE_SIGN_ENTITLEMENTS: SeasonalWidget/SeasonalWidget.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
